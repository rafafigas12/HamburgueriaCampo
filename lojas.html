<!DOCTYPE html>

<body>

    <header class="navbar">
        <div class="logo">
            <h1><a href="index.html">Hamburgueria do Campo</a></h1>

        <button class="menu-toggle" id="menu-toggle" aria-label="Abrir Menu">
            <i class="fa-solid fa-bars"></i>

        <nav>
            <ul class="nav-links">

                <li><a href="index.html#menu">Menu</a></li>

                <li><a href="index.html#reservas">Reservas</a></li>

            <a href="https://www.instagram.com/hamburgueria.docampo/" target="_blank" aria-label="Instagram">

        <section id="hero" class="hero hero-lojas">

        <section id="lojas" class="lojas-section">

            <div id="lojas-container" class="lojas-grid"></div>
