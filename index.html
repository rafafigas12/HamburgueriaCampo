<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <!-- Meta tag essencial para o design responsivo funcionar corretamente -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamburgueria do Campo</title>

    <!-- Favicon / Logótipo no separador do navegador -->
    <link rel="icon" type="image/jpeg" href="fotos/logo.jpg">

    <!-- CSS Mobile (aplicado em ecrãs até 768px de largura) -->
    <link rel="stylesheet" href="mobile.css" media="screen and (max-width: 768px)">

    <!-- CSS Desktop (aplicado em ecrãs com 769px ou mais de largura) -->
    <link rel="stylesheet" href="desktop.css" media="screen and (min-width: 769px)">

    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Fredoka+One&family=Titan+One&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="navbar">
        <div class="logo">
            <!-- Podes substituir por uma tag <img> com o logótipo -->
            <h1><a href="#hero">Hamburgueria do Campo</a></h1>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="index.html#menu">Menu</a></li>
                <li><a href="lojas.html">Lojas</a></li>
                <li><a href="index.html#reservas">Reservas</a></li>
            </ul>
        </nav>
        <div class="social-links">
            <!-- O link aponta diretamente para o Instagram do teu cliente -->
            <a href="https://www.instagram.com/hamburgueria.docampo/" target="_blank" aria-label="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <!-- Podes adicionar o Facebook ou outros da mesma forma -->
            <a href="https://www.facebook.com/Portela.de.Sintra2022/?locale=pt_PT" target="_blank"
                aria-label="Facebook">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
        </div>
    </header>

    <main>
        <!-- Hero Section: A primeira imagem grande que o utilizador vê -->
        <section id="hero" class="hero">
            <!-- Imagens de Fundo -->
            <div class="hero-bg slide active" style="background-image: url('fotos/6pratos_fundo.jpeg');"></div>
            <div class="hero-bg slide" style="background-image: url('fotos/interior_sintra.jpg');"></div>
            <div class="hero-bg slide" style="background-image: url('fotos/salada_fundo.jpeg');"></div>

            <!--<div class="hero-content">
                <h2>O Verdadeiro Sabor Artesanal</h2>
                <p>Ingredientes frescos, confecionados com paixão.</p>
                <a href="#menu" class="btn-primary">Ver Menu</a>
            </div> -->
        </section>

        <!-- Secção de Categorias de Menu (Estilo Hamburgueria do Bairro) -->
        <section id="menu" class="menu-categorias">
            <div class="categoria-card">
                <h3>Hambúrgueres</h3>
                <p>100% Carne de Novilho</p>
            </div>
            <div class="categoria-card">
                <h3>Vegan</h3>
                <p>Sabor sem compromisso</p>
            </div>
            <div class="categoria-card">
                <h3>Sobremesas</h3>
                <p>Para adoçar o final</p>
            </div>
        </section>

        <!-- Secção das Lojas onde o JavaScript vai injetar os dados -->
        <section id="lojas" class="lojas-section">
            <h2>Visita o nosso Campo!</h2>
            <!-- Este contentor recebe os cards criados dinamicamente no JS -->

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Hamburgueria do Campo. Todos os direitos reservados.</p>

    </footer>

    <!-- Script para carregar o JSON das lojas -->
    <script src="lojas.js"></script>
</body>

</html>
